<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聖經時間軸">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>聖經時間軸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and reverent, dense like a study Bible
   IDEA the fold-out chronological wall chart printed in the back of a study Bible
   PICTURE a full-width band of fourteen era fields that is both the map and the navigation
   COLOUR white ground, near-black ink, era colours as flat fields, gold for typology links
   TYPE Noto Serif TC for titles and scripture, Noto Sans TC for working text
   LAYOUT laptop: band on top, timeline list left, sticky event panel right; phone: band, list, panel as full sheet */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#14130f);--ink:light-dark(#1b1a17,#ece8df);--mute:light-dark(#62605a,#a8a397);--line:light-dark(#e4e1da,#2c2a24);--panel:light-dark(#f6f4ef,#1d1b17);--gold:light-dark(#9a6f17,#d9ad4f);--acc:light-dark(#a32d2d,#e07a6a)}
:root{--fz:1}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:"Noto Serif TC",serif}
header{padding:max(16px,env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 10px max(4vw,16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font:900 clamp(28px,4vw,40px)/1.05 "Noto Serif TC",serif;margin:0;letter-spacing:-.01em}
h1 small{display:block;font:500 14px/1.4 "Noto Sans TC";color:var(--mute);letter-spacing:0;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.inp{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;font-size:16px}
#q{width:min(240px,60vw)}
.btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:42px;padding:0 12px;border:0;background:transparent}
.seg button.on{background:var(--ink);color:var(--bg)}
.band{display:flex;overflow-x:auto;scrollbar-width:thin;border-block:1px solid var(--line)}
.era{flex:1 0 96px;min-height:96px;padding:10px 10px 8px;color:#fff;border:0;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:filter .15s}
.era b{font:700 15px/1.25 "Noto Serif TC",serif}
.era span{font-size:12.5px;opacity:.92;line-height:1.3}
.era i{font-style:normal;font-size:13px;opacity:.85}
.era.dim{filter:saturate(.25) brightness(1.1)}
.era.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--bg)}
.pfband{display:flex;overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--line)}
.pf{flex:1 0 104px;min-height:58px;padding:7px 10px;border:0;border-right:2px solid var(--bg);text-align:left;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:1px;position:relative}
.pf b{font:700 14.5px/1.2 "Noto Serif TC",serif}
.pf span{font-size:12px;opacity:.92;line-height:1.25}
.pf.gap{flex:.6 0 84px;color:var(--mute);background:repeating-linear-gradient(135deg,var(--panel) 0 7px,var(--line) 7px 9px)}
.pf.hd{flex:0 0 auto;background:var(--ink);color:var(--bg)}
.pf.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ink)}
.pf.hd.cur::after{background:var(--gold)}
.era.out{filter:saturate(.15) brightness(1.15);opacity:.55}
.pft{width:100%;border-collapse:collapse;font-size:14px}
.pft th,.pft td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.pfchart+.sec .pft{min-width:680px}
.pft td:nth-child(3),.pft td:first-child{white-space:nowrap}
.pft th{font-weight:700;color:var(--mute);font-size:13px}
.pft .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.cgrp{margin:10px 0 14px}
.cgrp h4{margin:0 0 2px;font:700 16px/1.3 "Noto Serif TC",serif}
.cgrp p{margin:0 0 6px;font-size:13px;color:var(--mute)}
.cgrp .rel{display:flex;flex-wrap:wrap;gap:6px}
.chip small{font-size:11.5px;color:var(--mute)}
.chip.on small{color:inherit}
.pt{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--gold);color:var(--bg)}
#dPF{width:min(1040px,96vw)}
.pfchart{overflow-x:auto}
.geo svg{width:100%;height:auto;display:block;border-radius:8px}.geo a:focus-visible{outline:2px solid var(--acc)}.maps{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:start}.maps figure{margin:0}.maps figcaption{font-size:.85em;color:var(--mute);margin-top:4px}@media(max-width:700px){.maps{grid-template-columns:1fr}}
.pfchart svg{min-width:700px;width:100%;height:auto;display:block}
ul.pfl{padding-left:20px;margin:6px 0}
ul.pfl li{margin:4px 0}
.themes{display:flex;gap:8px;overflow-x:auto;padding:10px max(4vw,16px)}
.chip{flex:none;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;border-top:1px solid var(--line)}
#list{padding:8px max(2vw,16px) 80px max(4vw,16px);border-right:1px solid var(--line)}
.ehead{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 0 8px;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid}
.ehead h2{font:700 20px/1.2 "Noto Serif TC",serif;margin:0}
.ehead span{color:var(--mute);font-size:13.5px}
.ev{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 6px;border-radius:0}
.ev:hover{background:var(--panel)}
.ev.sel{background:var(--panel);box-shadow:inset 4px 0 0 var(--ec)}
.ev .dt{font-size:13px;color:var(--mute);line-height:1.35;padding-top:3px}
.ev .tt{font:700 16.5px/1.35 "Noto Serif TC",serif}
.ev .en{font-size:13px;color:var(--mute)}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tag{font-size:12.5px;padding:1px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.tag.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.tag.note{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.empty{padding:40px 8px;color:var(--mute)}
#panel{position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px max(4vw,20px) 80px clamp(20px,3vw,40px)}
.sheetbar{display:none}
.kick{font-size:14px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff;display:inline-block}
.ptitle{font:900 clamp(28px,3.4vw,40px)/1.08 "Noto Serif TC",serif;margin:10px 0 2px;letter-spacing:-.01em;text-wrap:balance}
.pen{color:var(--mute);font-size:15px}
.dates{margin:10px 0 0;font-size:15px}
.dates em{display:block;font-style:normal;color:var(--mute);font-size:14px}
.verse{margin:18px 0 6px;padding:16px 18px;background:var(--panel);border-radius:12px;border-left:4px solid var(--ec)}
.verse .ref{font-size:13.5px;color:var(--mute);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.verse p{margin:4px 0;font:500 calc(17px*var(--fz))/1.75 "Noto Serif TC",serif}
.verse p.en{font:400 calc(16px*var(--fz))/1.6 Georgia,"Times New Roman",serif;color:var(--mute)}
.verse sup{font-size:11px;color:var(--mute);margin-right:3px}
.lnk{background:none;border:0;padding:0;color:var(--gold);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:32px}
a.lnk{display:inline-flex;align-items:center}
.cfx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.cfx div{border-top:3px solid var(--ec);padding-top:8px}
.cfx h4,.sec h3{margin:0 0 4px;font-size:14px;color:var(--mute);font-weight:700}
.cfx p{margin:0;font-size:calc(15.5px*var(--fz))}
.sec{margin-top:26px}
.sec h3{font:700 19px/1.3 "Noto Serif TC",serif;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec h3 small{font:400 13px "Noto Sans TC";color:var(--mute)}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel button{min-height:40px}
.ty{display:grid;gap:8px}
.ty button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;text-align:left;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));background:color-mix(in srgb,var(--gold) 7%,var(--bg));border-radius:10px;padding:10px 12px}
.ty .arr{color:var(--gold);font-weight:700}
.ty b{display:block;font-family:"Noto Serif TC",serif}
.ty span{font-size:14.5px;color:var(--mute)}
.view{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.view .who{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:4px}
.view .who b{font-family:"Noto Serif TC",serif;font-size:16px}
.view .kind{font-size:12px;padding:1px 7px;border-radius:5px;white-space:nowrap}
.k-p{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.k-t{background:var(--panel);color:var(--mute);border:1px solid var(--line)}
.k-a{background:color-mix(in srgb,#2d6aa3 14%,transparent);color:light-dark(#2d6aa3,#8cb8e6)}
.view p{margin:0;font-size:calc(15.5px*var(--fz))}
.view.pw{border-color:#1f5f8b;border-width:2px;background:color-mix(in srgb,#1f5f8b 6%,var(--bg))}
.pwera{margin:10px 0 4px;border:1px solid color-mix(in srgb,#1f5f8b 40%,var(--line));border-radius:10px;padding:8px 12px;background:color-mix(in srgb,#1f5f8b 5%,var(--bg))}
.pwera summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-height:32px;padding-top:4px}
.pwera summary b{color:light-dark(#1f5f8b,#8cc3ea)}
.pwera summary span{font-size:13.5px;color:var(--mute)}
.pwera p{margin:6px 0 2px;font-size:15px}
.pwera .src{font-size:12.5px;color:var(--mute)}
.view .src{font-size:13px;color:var(--mute);margin-top:6px}
.note{border-left:3px solid var(--acc);padding:8px 0 8px 12px;margin-bottom:12px}
.note .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.note .h b{font-family:"Noto Serif TC",serif;font-size:15.5px}
.note p{margin:4px 0;white-space:pre-wrap}
.note .src{font-size:13px;color:var(--mute)}
.note .act{display:flex;gap:14px}
form.nf{display:grid;gap:10px;background:var(--panel);padding:14px;border-radius:12px}
form.nf .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{font-size:13.5px;color:var(--mute);display:grid;gap:4px}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;line-height:1.55}
.stat{font-size:13px;color:var(--mute);margin-top:6px}
dialog{border:0;border-radius:16px;padding:0;width:min(760px,94vw);max-height:90vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{position:sticky;top:0;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.dh h3{margin:0 auto 0 0;font:700 20px "Noto Serif TC",serif}
.db{padding:16px 20px 28px}
.rv{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;margin-bottom:10px}
.rv .n{color:var(--mute);font-size:12px;padding-top:6px;text-align:right}
.rv .z{font:500 calc(17px*var(--fz))/1.75 "Noto Serif TC",serif}
.rv .e{grid-column:2;font:400 calc(15.5px*var(--fz))/1.55 Georgia,serif;color:var(--mute)}
.rv.hi .z,.rv.hi .e{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.pl{display:grid;gap:8px}
.pl .pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pl .pr small{color:var(--mute);display:block}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.pnav,.rfoot{display:none}
.rfoot{gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
.pnav button,.rfoot button{flex:1}
@media(max-width:900px){
body.sheet{overflow:hidden}
.pnav{display:flex;gap:8px;position:sticky;bottom:0;margin:24px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:3}
main{grid-template-columns:minmax(0,1fr)}
#list{border-right:0;padding-right:max(4vw,16px)}
#panel{position:fixed;inset:0;height:100%;z-index:20;background:var(--bg);padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));overscroll-behavior:contain;transform:translateY(100%);transition:transform .25s}
#panel.open{transform:none}
.sheetbar{display:flex;position:sticky;top:0;background:var(--bg);margin:0 -16px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);z-index:3;gap:8px;align-items:center}
.sheetbar span{margin-right:auto;font-size:14px;color:var(--mute)}
}
@media(max-width:600px){
h1 small .long{display:none}
.ehead{flex-wrap:wrap;gap:2px 10px;padding-top:14px}
.ehead span{font-size:13px;flex-basis:100%}
dialog{overflow:hidden;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;display:none;flex-direction:column}
dialog[open]{display:flex}
.db{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.dh{padding-top:max(14px,env(safe-area-inset-top))}
.dh #rPrev,.dh #rNext{display:none}
.rfoot{display:flex}
.cfx{grid-template-columns:minmax(0,1fr)}form.nf .row{grid-template-columns:minmax(0,1fr)}}

/* ===== layout v2：左側時間軸 ===== */
header{padding:max(12px,env(safe-area-inset-top)) max(3vw,16px) 10px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(24px,3vw,32px)}
h1 small{font-size:13px;margin-top:2px}
#thSel{max-width:220px;padding-right:8px}
main{grid-template-columns:232px minmax(0,1fr) minmax(0,1.3fr);border-top:0}
#rail{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;scrollbar-width:thin;border-right:1px solid var(--line);padding:12px 10px 40px 12px;background:var(--bg)}
.rhd{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;margin-bottom:10px}
.rp{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 8px 6px 12px;border-left:5px solid var(--pc);border-radius:0 8px 8px 0;margin-top:10px}
.rp b{font:700 15.5px/1.2 "Noto Serif TC",serif;color:var(--pc);overflow-wrap:anywhere}
.rp b small{font:500 12px "Noto Sans TC";color:var(--mute);margin-left:6px}
.rp span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.rp.gap{--pc:var(--mute);border-left-style:dotted;background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--line) 70%,transparent) 7px 9px)}
.rp.cur{background:color-mix(in srgb,var(--pc) 10%,transparent)}
.rp.gap.cur{background:var(--panel)}
.rg{margin-left:14px;border-left:2px solid var(--line);padding:2px 0}
.re{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 6px 6px 0;margin-left:-8px;border-radius:8px;min-height:40px}
.re i{width:14px;height:14px;border-radius:50%;background:var(--ec);border:3px solid var(--bg);box-sizing:content-box;margin-left:-3px}
.re b{font-size:14px;font-weight:500;line-height:1.25;display:block}
.re small{display:block;font-size:11.5px;color:var(--mute)}
.re em{font-style:normal;font-size:12px;color:var(--mute)}
.re:hover{background:var(--panel)}
.re.on{background:var(--panel)}
.re.on b{font-weight:700}
.re.dim{opacity:.4}
.re.out,.rp.out{opacity:.35}
#list{padding:4px max(2vw,16px) 80px max(2vw,18px)}
.setg{display:grid;gap:10px;margin-bottom:18px}
.setr{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.setr span{font-weight:500}
.seth{font:700 17px "Noto Serif TC",serif;margin:8px 0 10px}
@media(max-width:1180px) and (min-width:901px){main{grid-template-columns:200px minmax(0,1fr) minmax(0,1.15fr)}}
@media(max-width:900px){
main{grid-template-columns:58px minmax(0,1fr)}
#rail{padding:6px 4px 60px;border-right:1px solid var(--line)}
.rhd{height:34px;font-size:11px;padding:0;margin-bottom:4px}
.rp{padding:4px 0 2px;border-left:0;border-top:3px solid var(--pc);border-radius:0;margin-top:8px;text-align:center}
.rp b{font-size:11.5px;display:block;line-height:1.2;hyphens:auto}
html[lang=en] .rp b{font-size:10.5px}
.rp b small,.rp span{display:none}
.rp.gap{border-top-style:dotted}
.rg{margin:2px 0 0;border:0;padding:0;display:grid;gap:3px}
.re{display:flex;flex-direction:column;justify-content:center;gap:0;margin:0;padding:4px 2px;min-height:46px;border-radius:7px;background:var(--ec);color:#fff;text-align:center}
.re i,.re small,.re em{display:none}
.re b{font-size:13px;font-weight:700;letter-spacing:.05em}
.re b .full{display:none}
.re.on{background:var(--ec);outline:3px solid var(--ink);outline-offset:-3px}
.re:hover{background:var(--ec)}
#list{padding:0 12px 90px 12px}
.ehead{margin:0 -12px;padding:12px 12px 8px}
.ehead h2{font-size:19px}
.ev{grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 4px}
.ev .dt{font-size:12.5px;padding:0;order:0}
.ev .tt{font-size:17.5px}
.ev .en{font-size:13.5px}
#panel .cfx p,#panel .view p,#panel .sec>p{font-size:calc(16.5px*var(--fz));line-height:1.75}
.verse{padding:14px 14px;margin-left:-4px;margin-right:-4px}
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;width:100%;margin-left:0}
.tools #q{grid-column:1/-1}
#thSel{max-width:none;width:100%}
header{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
}
@media(min-width:901px){.re b .short{display:none}}
.ehead{flex-wrap:wrap;row-gap:2px}.ehead h2{white-space:nowrap}
.rhd .s{display:none}
@media(max-width:900px){#q{width:100%}.rhd .l{display:none}.rhd .s{display:inline}}

/* ===== 雙主軸・簡約 ===== */
:root{--pw:light-dark(#1f5f8b,#8cc3ea);--kl:light-dark(#a32d2d,#e58a7c)}
.mks{display:flex;gap:4px;margin-top:6px}
.mk{font-style:normal;font-size:11px;line-height:18px;width:18px;text-align:center;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.mk.mp{color:var(--pw);border-color:color-mix(in srgb,var(--pw) 45%,transparent)}
.mk.mkk{color:var(--kl);border-color:color-mix(in srgb,var(--kl) 45%,transparent)}
.mk.mt{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ax{border-top:3px solid var(--axc);padding:10px 2px 4px}
.ax.ap{--axc:var(--pw)}.ax.ak{--axc:var(--kl)}
.ax h5{margin:0 0 6px;font:700 16px "Noto Serif TC",serif;color:var(--axc);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.ax h5 small{font:400 12px "Noto Sans TC";color:var(--mute)}
.ax h5 em{font:400 11.5px "Noto Sans TC";font-style:normal;color:var(--axc);border:1px solid color-mix(in srgb,var(--axc) 40%,transparent);border-radius:4px;padding:0 6px}
.ax p{margin:0 0 6px;font-size:calc(15.5px*var(--fz));line-height:1.7}
.ax .src,.ov .src,.guide .src{font-size:12.5px;color:var(--mute)}
.ax.empty{opacity:.6}
.ax p.s2{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
ul.tb{margin:0 0 8px;padding-left:18px}ul.tb li{margin:3px 0;font-size:14.5px}
.guide{margin:10px 0 6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.guide summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;min-height:36px}
.guide summary b{font-size:14.5px}.guide summary span{font-size:13px;color:var(--mute)}
.guide .duo{margin:4px 0 6px}
.act{display:inline-block;margin-left:8px;font-size:13px;color:var(--kl);border:1px solid color-mix(in srgb,var(--kl) 40%,transparent);border-radius:6px;padding:2px 8px;vertical-align:2px}
.kick{font-weight:600}
.others{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.others summary{cursor:pointer;color:var(--mute);font-size:14px;min-height:36px;display:flex;align-items:center}
.aud .src{font-size:12.5px;color:var(--mute)}.aud ul{margin:4px 0}
.ov{padding:8px 0;border-bottom:1px solid var(--line)}.ov b{font-size:14px}.ov p{margin:2px 0;font-size:15px}
.iss{border-bottom:1px solid var(--line);padding:6px 0 12px}
.iss summary{cursor:pointer;display:grid;gap:2px;padding:8px 0;min-height:44px}
.iss summary b{font:700 18px "Noto Serif TC",serif}.iss summary span{font-size:14px;color:var(--mute)}
.iss .oth{margin:10px 0;border-left:3px solid var(--line);padding-left:12px}
.cmp{background:var(--panel);border-radius:10px;padding:10px 12px;margin:10px 0}
.cmp p{margin:4px 0;font-size:14.5px}.cmp b{margin-right:8px}
#dIss{width:min(980px,96vw)}
.verse{border-left-width:3px}
.cfx div{border-top-width:2px}
@media(max-width:900px){.duo{grid-template-columns:minmax(0,1fr);gap:4px}.ax p{font-size:calc(16.5px*var(--fz))}.act{margin:6px 0 0 0}}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
</style>

<body>
<header>
  <h1>聖經時間軸<small>鮑森的歷史軸 × 凱勒的福音軸</small></h1>
  <div class="tools">
    <input id="q" class="inp" type="search" placeholder="搜尋事件、人物、經文" aria-label="搜尋">
    <select id="thSel" class="inp" aria-label="神學主題路徑"></select>
    <button class="btn" id="bUI" aria-label="Language">EN</button>
    <button class="btn" id="bIss">議題</button>
    <button class="btn" id="bSet" aria-label="設定">設定</button>
  </div>
</header>
<main>
  <aside id="rail" aria-label="時間軸"></aside>
  <section id="list" aria-label="事件列表"></section>
  <article id="panel" aria-live="polite"></article>
</main>

<dialog id="dRead" aria-label="讀經"><div class="dh"><h3 id="rTitle"></h3><button class="btn" id="rPrev">上一章</button><button class="btn" id="rNext">下一章</button><button class="btn" data-close>關閉</button></div><div class="db" id="rBody"></div><div class="rfoot"><button class="btn" data-rp="-1">上一章</button><button class="btn" data-rp="1">下一章</button></div></dialog>
<dialog id="dSet"><div class="dh"><h3>設定</h3><button class="btn" data-close>關閉</button></div><div class="db"><div class="setg">
<div class="setr"><span>經文語言</span><div class="seg" id="lang" role="group" aria-label="經文語言"><button data-l="zh">中</button><button data-l="both" class="on">雙語</button><button data-l="en">EN</button></div></div>
<div class="setr"><span>字級</span><button class="btn" id="bFz" aria-label="字級">字級 中</button></div>
<div class="setr"><span>鮑森框架</span><button class="btn" id="bPF3">看全貌圖</button></div>
</div><h3 class="seth">牧者名單與資料來源</h3><div id="sBody"></div></div></dialog>
<dialog id="dPF" aria-label="鮑森框架全貌"><div class="dh"><h3>鮑森框架：舊約兩千年全貌</h3><button class="btn" data-close>關閉</button></div><div class="db" id="pfBody"></div></dialog>
<dialog id="dIss" aria-label="議題對照"><div class="dh"><h3>議題對照</h3><button class="btn" data-close>關閉</button></div><div class="db" id="iBody"></div></dialog>
<div class="toast" id="toast"></div>

<script src="data/books.js"></script>
<script src="data/eras.js"></script>
<script src="data/events-ot.js"></script>
<script src="data/events-nt.js"></script>
<script src="data/pawson.js"></script>
<script src="data/pawson-zonglan.js"></script>
<script src="data/pawson-framework.js"></script>
<script src="data/keller.js"></script>
<script src="data/issues.js"></script>
<script src="data/keller-audio.js"></script>
<script src="data/en/ev-ot1.js"></script>
<script src="data/en/ev-ot2.js"></script>
<script src="data/en/ev-nt.js"></script>
<script src="data/en/pawson.js"></script>
<script src="data/en/rest.js"></script>
<script src="data/en/apply.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const EN=!!window.UI_EN,L=(z,e)=>EN?e:z,srcEN=window.srcEN||(x=>x);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ERAS=window.ERAS,EV=window.EVENTS,TH=window.THEMES,BOOK={};
window.BOOKS.forEach((b,i)=>BOOK[b[0]]={zh:b[1],en:b[2],n:b[3],i});
const ZLL=window.ZL_LECTURES||{},ZLV=window.ZL_VIEWS||{},ZLE=window.ZL_ERA||{};
EV.forEach(e=>{e.v=(e.v||[]).filter(v=>v.k==="p");const z=ZLV[e.id],pw=z||(window.PAWSON||{})[e.id];if(pw){const old=z&&(window.PAWSON||{})[e.id];e.v.unshift({k:"p",w:"pawson",s:pw.s,src:z?z.lec.map(k=>ZLL[k].n).join("；"):pw.src,lec:z&&z.lec,tg:pw.tg||((window.PAWSON||{})[e.id]||{}).tg,s2:old&&old.s,src2:old&&old.src});(e.th=e.th||[]).push("pawson")}});
/* 主軸整理：鮑森、凱勒；其他牧者另放 */
const mute=h=>{const n=parseInt(h.slice(1),16),m=[n>>16&255,n>>8&255,n&255],g=[138,133,124];return"#"+m.map((v,i)=>Math.round(v*.72+g[i]*.28).toString(16).padStart(2,"0")).join("")};
ERAS.forEach(r=>r.c=mute(r.c));(window.PF_PERIODS||[]).forEach(p=>{if(p.c)p.c=mute(p.c)});
const KA=window.KELLER_ACTS||[],KAE=window.KELLER_ACT_ERA||[],KAV=window.KELLER_ACT_EV||{},KE=window.KELLER_ERA||{},ISS=window.ISSUES||[];
const actOf=e=>KA.find(a=>a.id===(KAV[e.id]||KAE[e.e]));
const issOf={};ISS.forEach(x=>x.ev.forEach(id=>(issOf[id]=issOf[id]||[]).push(x)));
TH.keller={n:L("凱勒重點","Keller"),en:"Keller",c:"#a32d2d"};
const lecLinks=ks=>ks.map(k=>ZLL[k]?`<a class="lnk" href="${ZLL[k].u}" target="_blank" rel="noopener">${esc(ZLL[k].n)} ↗</a>`:"").join("　");
const PE=window.PAWSON_ERAS||[];
const byId={};EV.forEach(e=>byId[e.id]=e);
(window.ZL_TY||[]).forEach(t=>{const f=EV.find(e=>e.id===t.from);if(f)(f.ty=f.ty||[]).push({to:t.to,n:t.n})});
Object.entries(window.KELLER_VIEWS||{}).forEach(([id,k])=>{const e=EV.find(x=>x.id===id);if(e&&!e.v.some(v=>v.w==="keller"))e.v.push({k:"p",w:"keller",s:k.s,src:k.src})});
EV.forEach(e=>{e.P=e.v.find(v=>v.w==="pawson");e.K=e.v.find(v=>v.w==="keller");e.O=e.v.filter(v=>v.w!=="pawson"&&v.w!=="keller");if(e.K)(e.th=e.th||[]).push("keller")});
const back={};EV.forEach(e=>(e.ty||[]).forEach(t=>(back[t.to]=back[t.to]||[]).push({from:e.id,n:t.n})));
const S={era:null,theme:null,q:"",sel:null,lang:"both",notes:[],pastors:window.DEFAULT_PASTORS.slice(),store:"local",editing:null};
try{S.lang=localStorage.getItem("bt-lang")||"both"}catch(e){}
if(EN)S.lang="en";

/* ---------- storage: claude db (private per viewer) or local fallback ---------- */
let notesCol=null,setDoc=null;
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
S.notes=[];
async function initDb(){
  const C=window.claude;if(!C||!C.use)return;
  try{
    const db=await C.use("db"),user=await C.use("user");if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    notesCol=db.doc("data/users/"+uid+"/notebook").collection("notes");
    setDoc=db.doc("data/users/"+uid+"/settings");
    S.store="sync";
    const t=setTimeout(()=>{S.store="slow";renderAll()},10000);
    notesCol.onSnapshot(snap=>{clearTimeout(t);S.store="sync";S.notes=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(!snap.metadata.fromCache)migrateLocal();renderAll()},err=>{clearTimeout(t);S.store="local";renderAll()});
    setDoc.onSnapshot(s=>{if(s.exists&&Array.isArray(s.data().pastors))S.pastors=s.data().pastors;renderAll()},()=>{});
  }catch(e){S.store="local"}
}
let migrated=false;
async function migrateLocal(){
  if(migrated)return;migrated=true;
  const loc=LS.get("bt-notes",[]);if(!loc.length)return;
  const have=new Set(S.notes.map(n=>n.id));
  for(const n of loc){if(have.has(n.id))continue;const {id,...b}=n;try{await notesCol.doc(id).set(b)}catch(e){return}}
  LS.set("bt-notes",[]);toast("已把本機筆記同步到雲端");
}
const nid=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function saveNote(n){
  if(notesCol){const {id,...b}=n;try{await notesCol.doc(id).set(b);return true}catch(e){toast("儲存失敗："+(e.code||"請稍後再試"));return false}}
  const i=S.notes.findIndex(x=>x.id===n.id);if(i>=0)S.notes[i]=n;else S.notes.push(n);LS.set("bt-notes",S.notes);renderAll();return true;
}
async function delNote(id){
  if(notesCol){try{await notesCol.doc(id).delete()}catch(e){toast("刪除失敗")}return}
  S.notes=S.notes.filter(n=>n.id!==id);LS.set("bt-notes",S.notes);renderAll();
}
async function savePastors(){
  if(setDoc){try{await setDoc.set({pastors:S.pastors})}catch(e){toast("儲存失敗")}}else{LS.set("bt-pastors",S.pastors);renderAll()}
}
const pastor=id=>S.pastors.find(p=>p.id===id)||window.DEFAULT_PASTORS.find(p=>p.id===id)||{id,n:id,en:""};

/* ---------- bible text ---------- */
const cache={};
function loadBook(code,l){const k=l+code;if(!cache[k])cache[k]=fetch("bible/"+l+"/"+code+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).catch(e=>{delete cache[k];throw e});return cache[k]}
function parseRef(r){const m=r.trim().match(/^(\w+) (\d+):(\d+)(?:-(\d+))?$/);return m?{b:m[1],c:+m[2],a:+m[3],z:+(m[4]||m[3])}:null}
const refLabel=(p,l)=>l==="en"?BOOK[p.b].en+" "+p.c+":"+p.a+(p.z>p.a?"-"+p.z:""):BOOK[p.b].zh+" "+p.c+":"+p.a+(p.z>p.a?"-"+p.z:"");
const esvUrl=p=>"https://www.esv.org/"+encodeURIComponent(BOOK[p.b].en+" "+p.c+":"+p.a+(p.z>p.a?"-"+p.z:"")).replace(/%20/g,"+")+"/";
async function versesHtml(ref,l){
  const p=parseRef(ref);if(!p)return"";
  let zh=null,en=null;
  try{[zh,en]=await Promise.all([l!=="en"?loadBook(p.b,"zh"):null,l!=="zh"?loadBook(p.b,"en"):null])}catch(e){return`<p>${L("經文載入失敗，請重新整理。","Could not load the text. Please refresh.")}</p>`}
  let h="";
  if(zh){h+="<p>";for(let v=p.a;v<=p.z;v++)h+=`<sup>${v}</sup>${esc(zh[p.c-1][v-1]||"")}`;h+="</p>"}
  if(en){h+='<p class="en">';for(let v=p.a;v<=p.z;v++)h+=`<sup>${v}</sup>${esc(en[p.c-1][v-1]||"")} `;h+="</p>"}
  return h;
}

/* ---------- filtering ---------- */
function match(e){
  if(S.theme&&!(e.th||[]).includes(S.theme))return false;
  if(S.q){const q=S.q.toLowerCase();const hay=[e.t,e.en,e.p,e.bg,e.c,e.f,e.d,(e.r||"").split(";").map(r=>{const p=parseRef(r);return p?refLabel(p,"zh")+" "+refLabel(p,"en"):""}).join(" "),(e.v||[]).map(v=>v.s+(v.w||"")).join(" "),S.notes.filter(n=>n.ev===e.id).map(n=>n.text+n.src).join(" ")].join(" ").toLowerCase();if(!hay.includes(q))return false}
  return true;
}
const noteCount=id=>S.notes.filter(n=>n.ev===id).length;

/* ---------- render: band, themes, list ---------- */
const ESHORT=EN?["Orig","Patr","Exod","Conq","Judg","King","Split","Exile","Return","Inter","Birth","Min","Cross","Church"]:["創造","族長","出埃","征服","士師","聯合","分裂","被擄","歸回","兩約","降生","傳道","受難","教會"];
function renderBand(){
  const cnt=ERAS.map((_,i)=>EV.filter(e=>e.e===i&&match(e)).length),PFn=window.PF_PERIODS||[];
  const era=i=>`<button class="re${cnt[i]?"":" dim"}${S.era===i?" on":""}${S.pf!=null&&!PFn[S.pf].eras.includes(i)?" out":""}" style="--ec:${ERAS[i].c}" data-era="${i}" aria-label="${esc(ERAS[i].n)}${L("，"+cnt[i]+" 個事件",", "+cnt[i]+" events")}"><i></i><span><b><span class="full">${esc(ERAS[i].n)}</span><span class="short">${ESHORT[i]||""}</span></b><small>${esc(ERAS[i].d)}</small></span><em>${cnt[i]}</em></button>`;
  $("#rail").innerHTML=`<button class="rhd" id="bPF" aria-label="${L("鮑森框架全貌圖","Pawson framework overview")}"><span class="l">${L("鮑森框架 全貌圖 ›","Pawson framework ›")}</span><span class="s">${L("全貌","Map")}</span></button>`+PFn.map((p,j)=>`<button class="rp${p.k==="g"?" gap":""}${S.pf===j?" cur":""}${S.pf!=null&&S.pf!==j?" out":""}" style="--pc:${p.c||"var(--mute)"}" data-pf="${j}"><b>${esc(p.k==="g"?L("沉默","Silence"):p.n)}<small>${esc(p.sub)}</small></b><span>${p.k==="g"?esc(p.n):esc(p.who)+(p.lead!=="—"?"・"+esc(p.lead):"")}</span></button>${p.eras.length?`<div class="rg">${p.eras.map(era).join("")}</div>`:""}`).join("");
}
function renderThemes(){
  $("#thSel").innerHTML=`<option value="">${L("全部事件","All events")}</option>`+Object.entries(TH).map(([k,t])=>`<option value="${k}"${S.theme===k?" selected":""}>${L("主題：","Theme: ")}${esc(t.n)}</option>`).join("");
}
function eraGuide(i){
  const z=ZLE[i],pe=PE[i],k=KE[i];if(!z&&!pe&&!k)return"";
  const pw=z?`<p>${esc(z.s)}</p>${i===2?`<div class="geo">${torahSvg()}</div>`:""}<div class="src">${lecLinks(z.lec)}</div>`:pe?`<p>${esc(pe.s)}</p><div class="src">${esc(pe.v)} ${esc(pe.ch)}</div>`:`<p class="stat">${L("尚未收錄","Not yet added")}</p>`;
  const kw=k?`${(k.tb||[]).length?`<ul class="tb">${k.tb.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}${k.s?`<p>${esc(k.s)}</p>`:""}<div class="src">${esc(k.src)}</div>`:`<p class="stat">${L("尚未收錄","Not yet added")}</p>`;
  return`<details class="guide"><summary><b>${L("導讀","Guide")}</b><span>${L("鮑森・歷史　凱勒・福音","Pawson: history · Keller: gospel")}</span></summary><div class="duo"><div class="ax ap"><h5>${L("鮑森","Pawson")}</h5>${pw}</div><div class="ax ak"><h5>${L("凱勒","Keller")}</h5>${kw}</div></div><div class="src">${L("轉述摘要，非原文引用。","Paraphrased summaries, not direct quotations.")}</div></details>`;
}
function renderList(){
  let h="",any=false;
  ERAS.forEach((r,i)=>{
    const es=EV.filter(e=>e.e===i&&match(e));if(!es.length)return;any=true;
    h+=`<div class="ehead" id="era-${i}" style="border-color:${r.c}"><h2 style="color:${r.c}">${esc(r.n)}</h2><span>${esc(r.d)} · ${esc(r.b)}${KA.length?` · ${L("福音軸：","Gospel axis: ")}${esc(KA.find(a=>a.id===KAE[i]).n)}`:""}</span></div>`;
    h+=eraGuide(i);
    h+=es.map(e=>{const tyc=(e.ty||[]).length+(back[e.id]||[]).length;
      return`<button class="ev${S.sel===e.id?" sel":""}" style="--ec:${r.c}" data-ev="${e.id}"><div class="dt">${esc(e.d)}</div><div><div class="tt">${esc(e.t)}</div><div class="en">${EN?"":esc(e.en)}${e.r?(EN?"":" · ")+esc(refLabel(parseRef(e.r.split(";")[0]),"zh")):""}</div><div class="mks">${e.P?`<i class="mk mp" title="${L("鮑森","Pawson")}">${L("鮑","P")}</i>`:""}${e.K?`<i class="mk mkk" title="${L("凱勒","Keller")}">${L("凱","K")}</i>`:""}${tyc?`<i class="mk mt" title="${L("預表與應驗","Foreshadowing")}">${L("預","F")}</i>`:""}${issOf[e.id]?`<i class="mk mi" title="${L("相關議題","Issues")}">${L("議","I")}</i>`:""}</div></div></button>`}).join("");
  });
  if(!any)h=L(`<p class="empty">沒有符合「${esc(S.q)}」的事件。試試人物名、書卷名或主題。</p>`,`<p class="empty">No events match "${esc(S.q)}". Try a person, a book or a theme.</p>`);
  if(S.theme)h=L(`<p class="stat" style="padding-top:12px">主題路徑：<b>${esc(TH[S.theme].n)}</b>，沿著時間順序讀，就是這個主題在整本聖經中的發展。</p>`,`<p class="stat" style="padding-top:12px">Theme path: <b>${esc(TH[S.theme].n)}</b>. Read in time order to follow how this theme develops through the whole Bible.</p>`)+h;
  $("#list").innerHTML=h;
}

/* ---------- render: panel ---------- */
let panelToken=0;
function axCard(v,cls,n,en){
  if(!v)return`<div class="ax ${cls} empty"><h5>${n}<small>${en}</small></h5><p class="stat">—</p></div>`;
  const src=v.lec?`<div class="src">${lecLinks(v.lec)}</div>`:v.src?`<div class="src">${esc(v.src)}</div>`:"";
  return`<div class="ax ${cls}"><h5>${n}<small>${en}</small>${v.tg?`<em>${esc(v.tg)}</em>`:""}</h5><p>${esc(v.s)}</p>${src}${v.s2?`<p class="s2">${esc(v.s2)}</p><div class="src">${esc(v.src2||"")}</div>`:""}</div>`;
}
function audioSec(list){
  if(!list||!list.length)return"";const A=window.KELLER_AUDIO_SRC;

    case"rPrev":openRead(RD.b,RD.c-1);break;case"rNext":openRead(RD.b,RD.c+1);break;
    case"bNotes":$("#dNotes").showModal();renderNotes();break;
    case"bSet":pEdit=null;$("#dSet").showModal();renderSet();break;
    case"nfCancel":S.editing=null;renderPanel();break;
    case"exp":{const data=JSON.stringify({app:"bible-timeline",v:1,pastors:S.pastors,notes:S.notes},null,1);$("#impT").value=data;try{await navigator.clipboard.writeText(data);toast("已複製，可貼到 Google Drive 或備忘錄保存")}catch(e){$("#impT").select();toast("已放進下方文字框，請手動複製")}break}
    case"imp":{let d;try{d=JSON.parse($("#impT").value)}catch(e){toast("JSON 格式不正確");break}
      if(Array.isArray(d.pastors)){const ids=new Set(S.pastors.map(p=>p.id));d.pastors.forEach(p=>{if(p&&p.id&&!ids.has(p.id))S.pastors.push(p)});await savePastors()}
      let c=0;const have=new Set(S.notes.map(n=>n.id));for(const n of d.notes||[]){if(n&&n.id&&n.ev&&n.text&&!have.has(n.id)){if(await saveNote(n))c++}}
      toast("匯入 "+c+" 筆筆記");renderSet();break}
  }
});
document.addEventListener("submit",async ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==="nf"){
    const text=$("#nfT").value.trim();if(!text){$("#nfT").focus();return}
    const old=S.editing&&S.notes.find(n=>n.id===S.editing);
    const n={id:old?old.id:nid(),ev:f.dataset.ev,p:$("#nfP").value,kind:$("#nfK").value,src:$("#nfS").value.trim(),text,ts:old?old.ts:Date.now(),up:Date.now()};
    S.lastPastor=n.p;const btn=f.querySelector("[type=submit]");btn.disabled=true;
    if(await saveNote(n)){S.editing=null;toast(old?"已更新":"已加入筆記");document.activeElement.blur();renderAll()}else btn.disabled=false;
  }
  if(f.id==="pf"){
    const n=$("#pfN").value.trim();if(!n)return;const p={n,en:$("#pfE").value.trim(),note:$("#pfB").value.trim()};
    if(pEdit!==null){Object.assign(S.pastors[pEdit],p);pEdit=null}else S.pastors.push(Object.assign({id:"p"+Date.now().toString(36)},p));
    await savePastors();renderSet();toast("已儲存牧者名單");
  }
});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();renderBand();renderList()},150)});
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select"))return;if(e.key==="ArrowDown"||e.key==="j"){if(S.sel){e.preventDefault();step(1)}}if(e.key==="ArrowUp"||e.key==="k"){if(S.sel){e.preventDefault();step(-1)}}});
const FZ=EN?[[0.92,"S"],[1,"M"],[1.15,"L"]]:[[0.92,"小"],[1,"中"],[1.15,"大"]];
S.fz=+LS.get("bt-fz",1);
function setFz(i){S.fz=i;document.documentElement.style.setProperty("--fz",FZ[i][0]);$("#bFz").textContent=L("字級 ","Size ")+FZ[i][1];LS.set("bt-fz",i)}
setFz(S.fz in FZ?S.fz:1);
function closeSheet(){$("#panel").classList.remove("open");document.body.classList.remove("sheet")}
function swipe(el,fn){let x0,y0,t0;el.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now()},{passive:true});
  el.addEventListener("touchend",e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-t0<600&&!e.target.closest(".band,.themes,.rel,.scroll"))fn(dx<0?1:-1)},{passive:true})}
swipe($("#panel"),d=>{if(window.innerWidth<=900)step(d)});
swipe($("#rBody"),d=>{const c=RD.c+d;if(c>=1&&c<=BOOK[RD.b].n)openRead(RD.b,c)});
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600)}
function fromHash(){const h=location.hash.slice(1);if(byId[h])select(h,false)}
window.addEventListener("hashchange",fromHash);
if(EN){document.title="Bible Timeline";
  $("h1").innerHTML="Bible Timeline<small>Pawson's history axis × Keller's gospel axis</small>";
  $("#q").placeholder="Search events, people, verses";$("#bUI").textContent="中文";$("#bIss").textContent="Issues";$("#bSet").textContent="Settings";
  $("#dSet h3").textContent="Settings";$("#dSet .seth").textContent="Pastors and sources";
  const sr=document.querySelectorAll("#dSet .setr");sr[0].style.display="none";sr[1].querySelector("span").textContent="Text size";sr[2].querySelector("span").textContent="Pawson's framework";$("#bPF3").textContent="Overview chart";
  $("#dPF h3").textContent="Pawson's framework: two thousand years of the Old Testament";$("#dIss h3").textContent="Issues compared";
  document.querySelectorAll("[data-close]").forEach(b=>b.textContent="Close");$("#rPrev").textContent="Prev chapter";$("#rNext").textContent="Next chapter";}
$("#thSel").addEventListener("change",e=>{S.theme=e.target.value||null;renderAll();window.scrollTo({top:0})});
/* 捲動時，左側時間軸標出目前所在的時代 */
let spyT;function spy(){clearTimeout(spyT);spyT=setTimeout(()=>{const hs=[...document.querySelectorAll(".ehead")];let cur=null;for(const h of hs){if(h.getBoundingClientRect().top<=window.innerHeight*0.35)cur=+h.id.slice(4);else break}
  if(cur==null&&hs[0])cur=+hs[0].id.slice(4);if(cur===S.era)return;S.era=cur;document.querySelectorAll(".re").forEach(b=>b.classList.toggle("on",+b.dataset.era===cur));const b=document.querySelector(`.re[data-era="${cur}"]`),R=$("#rail");if(b&&R){const br=b.getBoundingClientRect(),rr=R.getBoundingClientRect();if(br.top<rr.top+40||br.bottom>rr.bottom-40)R.scrollTop+=br.top-rr.top-rr.height/3}},60)}
window.addEventListener("scroll",spy,{passive:true});
$("#dPF").addEventListener("close",renderPFBand);

document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
renderAll();
if(byId[location.hash.slice(1)])fromHash();else if(window.innerWidth>900){S.sel="creation";renderList();renderPanel()}
}
</script>
